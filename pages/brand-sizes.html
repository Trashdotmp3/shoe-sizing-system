<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Sizes</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Brand Sizes</h1>
    <p class="subtitle">Manufacturer size charts loaded from Supabase</p>
  </header>

  <nav class="main-nav">
    <a href="../index.html">Home</a>
    <a href="brand-sizes.html">Brand Sizes</a>
    <a href="qr.html">QR Page</a>
    <a href="search.html">Search</a>
    <a href="stats.html">Statistics</a>
  </nav>

  <main class="container">
    <section class="card">
      <h2>Choose category</h2>
      <label for="category-select">Category:</label>
      <select id="category-select">
        <option value="men">Men</option>
        <option value="women">Women</option>
        <option value="kids">Kids</option>
      </select>
      <button id="load-sizes-button">Load brand sizes</button>
      <p id="brand-status">Ready to load data.</p>
      <p id="brand-source"></p>
    </section>

    <section id="brand-results" class="container"></section>
  </main>

  <script src="../supabase-config.js"></script>
  <script src="brand-sizes.js"></script>
</body>
</html>
