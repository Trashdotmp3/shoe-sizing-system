<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Size Recommendation</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header class="site-header">
    <h1 data-i18n="recommend.title">Size Recommendation</h1>
    <div class="lang-switch">
  <button class="lang-btn" data-lang-button="lt">LT</button>
  <button class="lang-btn" data-lang-button="en">EN</button>
</div>
  </header>

<nav class="main-nav">
  <a href="../index.html">Home</a>
  <a href="recommend.html">Recommendation</a>
  <a href="brand-sizes.html">Brand Sizes</a>
  <a href="qr.html">QR Page</a>
  <a href="search.html">Search</a>
  <a href="stats.html">Statistics</a>
</nav>

  <main class="container">
    <section class="card">
      <h2 data-i18n="recommend.enterTitle">Enter measurement</h2>

      <div class="form-row">
        <label for="category" data-i18n="recommend.categoryLabel">Category</label>
        <select id="category">
  <option value="men" data-i18n="common.men">Men</option>
  <option value="women" data-i18n="common.women">Women</option>
  <option value="kids" data-i18n="common.kids">Kids</option>
</select>
      </div>

      <div class="form-row">
        <label for="length-mm" data-i18n="recommend.lengthLabel">Measured length (mm)</label>
        <input id="length-mm" type="number" min="80" max="350" step="1" data-i18n-placeholder="recommend.lengthPlaceholder" placeholder="e.g. 275" />
      </div>

<button id="recommend-button" data-i18n="recommend.button">Get recommendation</button>
<p id="recommend-status" data-i18n="recommend.statusReady">Ready.</p>
    </section>

    <section class="card">
      <h2 data-i18n="recommend.generalTitle">General recommendation</h2>
      <div id="general-result" data-i18n="recommend.generalEmpty">No result yet.</div>
    </section>

    <section class="card">
  <h2 data-i18n="recommend.continueTitle">Continue</h2>
  <div id="continue-actions" data-i18n="recommend.continueEmpty">No actions yet.</div>
</section>
    
    <section class="card">
      <h2 data-i18n="recommend.brandTitle">Brand recommendations</h2>
<p data-i18n="recommend.brandNote">Brand sizes are calculated using measured length + 20 mm for comfort allowance.</p>
<div id="brand-recommendations" data-i18n="recommend.brandEmpty">No result yet.</div>
    </section>
  </main>
  
<script src="../lang.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="recommend.js"></script>
</body>
</html>
